services:
  scalwise-postgres:
    image: postgres:17
    container_name: scalwise-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - scalwise_postgres_data:/var/lib/postgresql/data
    networks:
      - scalwise_internal

  scalwise-app:
    build: .
    container_name: scalwise-app
    restart: unless-stopped
    environment:
      # POSTGRES_PASSWORD must not contain URL-special characters (/ @ : # %), since it's interpolated unencoded here -- generate it with e.g. `openssl rand -hex 32`, not `-base64` (which can emit `/` and `+`).
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@scalwise-postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      - RESEND_API_KEY=${RESEND_API_KEY:?RESEND_API_KEY is required}
      - ADMIN_ALERT_EMAIL=${ADMIN_ALERT_EMAIL:?ADMIN_ALERT_EMAIL is required}
      - DOWNLOAD_TOKEN_SECRET=${DOWNLOAD_TOKEN_SECRET:?DOWNLOAD_TOKEN_SECRET is required}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:?RAZORPAY_WEBHOOK_SECRET is required}
      - NODE_ENV=production
    volumes:
      - scalwise_media:/app/media
    depends_on:
      scalwise-postgres:
        condition: service_healthy
    networks:
      - scalwise_internal
      - n8n_default

# This app is deployed alongside an existing n8n + Caddy setup on the same
# VPS (see /opt/n8n). Joining n8n's compose-created network instead of
# defining our own lets the existing Caddy container reverse-proxy to
# scalwise-app by container name without any host-port publishing.
#
# scalwise-postgres deliberately stays off n8n_default: n8n executes
# arbitrary user-authored HTTP calls/code, and this database holds every
# inbound sales lead, so Postgres is isolated on scalwise_internal (not
# external, no bridge to n8n) -- only scalwise-app spans both networks.
networks:
  n8n_default:
    external: true
  scalwise_internal:
    internal: true

volumes:
  scalwise_postgres_data:
  scalwise_media:
